<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>OTK Admin</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #0f0f13;
    color: #e8e8f0;
    min-height: 100vh;
    padding: 16px;
  }
  h1 {
    font-size: 20px;
    font-weight: 700;
    color: #fff;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  h1 span { font-size: 22px; }

  .card {
    background: #1a1a24;
    border: 1px solid #2a2a3a;
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 14px;
  }
  .card-title {
    font-size: 13px;
    font-weight: 600;
    color: #9090b0;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 12px;
  }

  label { font-size: 14px; color: #b0b0c8; display: block; margin-bottom: 6px; }

  input[type="text"], input[type="password"], select {
    width: 100%;
    background: #0f0f18;
    border: 1px solid #2a2a3a;
    border-radius: 8px;
    color: #e8e8f0;
    font-size: 15px;
    padding: 12px;
    outline: none;
    transition: border-color 0.15s;
    -webkit-appearance: none;
  }
  input[type="text"]:focus, input[type="password"]:focus, select:focus {
    border-color: #5b6ef5;
  }
  select option { background: #1a1a24; }

  .pat-row { display: flex; gap: 8px; }
  .pat-row input { flex: 1; }

  .btn {
    border: none;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 600;
    padding: 12px 18px;
    cursor: pointer;
    transition: opacity 0.15s, transform 0.1s;
    white-space: nowrap;
  }
  .btn:active { transform: scale(0.97); }
  .btn-primary { background: #5b6ef5; color: #fff; }
  .btn-success { background: #22c55e; color: #fff; width: 100%; padding: 14px; font-size: 16px; }
  .btn-danger  { background: #ef4444; color: #fff; }
  .btn-sm      { padding: 8px 14px; font-size: 13px; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }

  /* Upload zone */
  .upload-zone {
    border: 2px dashed #2a2a3a;
    border-radius: 10px;
    padding: 24px 16px;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
    position: relative;
    margin-bottom: 10px;
  }
  .upload-zone.drag-over { border-color: #5b6ef5; background: #1f2040; }
  .upload-zone.has-file  { border-color: #22c55e; border-style: solid; }
  .upload-zone.has-error { border-color: #ef4444; border-style: solid; }
  .upload-zone input[type="file"] {
    position: absolute; inset: 0; opacity: 0; cursor: pointer;
    width: 100%; height: 100%;
  }
  .upload-icon { font-size: 32px; margin-bottom: 8px; }
  .upload-label { font-size: 15px; color: #9090b0; }
  .upload-label strong { color: #e8e8f0; }
  .upload-hint { font-size: 12px; color: #606080; margin-top: 4px; }

  /* File sections */
  .file-section { margin-bottom: 20px; }
  .file-section-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 10px;
  }
  .file-section-header h3 { font-size: 16px; font-weight: 600; }
  .badge {
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 20px;
    font-weight: 600;
  }
  .badge-ok    { background: #14532d; color: #4ade80; }
  .badge-error { background: #450a0a; color: #f87171; }
  .badge-info  { background: #1e1b4b; color: #a5b4fc; }

  /* Preview table */
  .preview-wrap {
    overflow-x: auto;
    border-radius: 8px;
    border: 1px solid #2a2a3a;
    margin-top: 10px;
    max-height: 260px;
    overflow-y: auto;
  }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th {
    background: #12121c;
    color: #8080a0;
    text-transform: uppercase;
    font-size: 11px;
    letter-spacing: 0.04em;
    padding: 8px 10px;
    text-align: left;
    position: sticky; top: 0;
  }
  td { padding: 7px 10px; border-top: 1px solid #1e1e2e; }
  tr:hover td { background: #1e1e2e; }

  /* Message box */
  .msg {
    border-radius: 8px;
    padding: 12px 14px;
    font-size: 14px;
    margin-top: 10px;
    line-height: 1.5;
  }
  .msg-error   { background: #450a0a; color: #fca5a5; border: 1px solid #7f1d1d; }
  .msg-success { background: #052e16; color: #86efac; border: 1px solid #14532d; }
  .msg-info    { background: #0f172a; color: #93c5fd; border: 1px solid #1e3a5f; }

  /* Status log */
  #log {
    background: #0a0a12;
    border: 1px solid #2a2a3a;
    border-radius: 8px;
    padding: 12px;
    font-size: 13px;
    font-family: monospace;
    max-height: 160px;
    overflow-y: auto;
    margin-top: 12px;
  }
  #log .log-line { margin-bottom: 4px; }
  #log .ok  { color: #4ade80; }
  #log .err { color: #f87171; }
  #log .inf { color: #93c5fd; }
  #log .wrn { color: #fbbf24; }

  .sep { height: 1px; background: #2a2a3a; margin: 16px 0; }
  .row { display: flex; gap: 10px; align-items: flex-start; }
  .row > * { flex: 1; }

  /* PAT visibility toggle */
  #pat-toggle { font-size: 18px; background: none; border: 1px solid #2a2a3a; border-radius: 8px; padding: 0 12px; cursor: pointer; color: #9090b0; }
</style>
</head>
<body>

<h1><span>🎭</span> OTK Admin</h1>

<!-- PAT 설정 -->
<div class="card" id="pat-card">
  <div class="card-title">GitHub 인증</div>
  <label for="pat-input">Personal Access Token</label>
  <div class="pat-row">
    <input type="password" id="pat-input" placeholder="ghp_xxxxxxxxxxxx" autocomplete="off">
    <button id="pat-toggle" onclick="togglePAT()">👁</button>
    <button class="btn btn-primary btn-sm" onclick="savePAT()">저장</button>
  </div>
  <div id="pat-msg"></div>
</div>

<!-- Repo 선택 -->
<div class="card">
  <div class="card-title">대상 저장소</div>
  <label for="repo-select">Repo 선택</label>
  <select id="repo-select" onchange="onRepoChange()">
    <option value="">— 로드 중 —</option>
  </select>
</div>

<!-- schedule.json -->
<div class="card" id="schedule-card">
  <div class="file-section">
    <div class="file-section-header">
      <h3>📅 schedule.json</h3>
      <span id="schedule-badge" class="badge badge-info">대기</span>
    </div>

    <div class="upload-zone" id="schedule-zone"
         ondragover="handleDrag(event,'schedule')"
         ondragleave="handleDragLeave(event,'schedule')"
         ondrop="handleDrop(event,'schedule')">
      <input type="file" accept=".json,application/json" onchange="handleFileInput(event,'schedule')">
      <div class="upload-icon">📂</div>
      <div class="upload-label"><strong>파일 선택</strong> 또는 드래그</div>
      <div class="upload-hint">*.json 파일 · 어떤 파일명이든 schedule.json으로 저장됩니다</div>
    </div>

    <div id="schedule-msg"></div>
    <div id="schedule-preview"></div>
  </div>
</div>

<!-- events.json -->
<div class="card" id="events-card">
  <div class="file-section">
    <div class="file-section-header">
      <h3>🗓 events.json</h3>
      <span id="events-badge" class="badge badge-info">대기</span>
    </div>

    <div class="upload-zone" id="events-zone"
         ondragover="handleDrag(event,'events')"
         ondragleave="handleDragLeave(event,'events')"
         ondrop="handleDrop(event,'events')">
      <input type="file" accept=".json,application/json" onchange="handleFileInput(event,'events')">
      <div class="upload-icon">📂</div>
      <div class="upload-label"><strong>파일 선택</strong> 또는 드래그</div>
      <div class="upload-hint">*.json 파일 · 어떤 파일명이든 events.json으로 저장됩니다</div>
    </div>

    <div id="events-msg"></div>
    <div id="events-preview"></div>
  </div>
</div>

<!-- 커밋 -->
<button class="btn btn-success" id="commit-btn" onclick="commitAll()" disabled>
  🚀 GitHub에 반영하기
</button>

<div id="log" style="display:none"></div>

<script>
const ORG = 'musical-otk';
let pat = '';
let pendingFiles = { schedule: null, events: null };
let currentSHAs = { schedule: null, events: null };

// ─── PAT ─────────────────────────────────────────────────────────────────────
function savePAT() {
  const v = document.getElementById('pat-input').value.trim();
  if (!v) return showMsg('pat-msg', 'error', 'PAT를 입력하세요.');
  pat = v;
  localStorage.setItem('otk_pat', v);
  showMsg('pat-msg', 'success', '저장됨. 레포 목록을 불러옵니다…');
  loadRepos();
}

function togglePAT() {
  const el = document.getElementById('pat-input');
  el.type = el.type === 'password' ? 'text' : 'password';
}

// ─── Repos ────────────────────────────────────────────────────────────────────
const KNOWN_REPOS = ['eoduk2026','letter2026','otk-schedule','outcasts2026','roger','roger2026','stone2026','stone2026_v2'];

async function loadRepos() {
  const sel = document.getElementById('repo-select');
  sel.innerHTML = '<option value="">— 불러오는 중 —</option>';
  try {
    const repos = await ghGet(`/orgs/${ORG}/repos?per_page=100&sort=updated`);
    const names = repos
      .map(r => r.name)
      .filter(n => !n.startsWith('_'))
      .sort();
    sel.innerHTML = '<option value="">— 선택하세요 —</option>' +
      names.map(n => `<option value="${n}">${n}</option>`).join('');
  } catch(e) {
    // org API 접근 실패 시 알려진 목록으로 대체
    sel.innerHTML = '<option value="">— 선택하세요 —</option>' +
      KNOWN_REPOS.map(n => `<option value="${n}">${n}</option>`).join('');
    showMsg('pat-msg', 'info', 'repo 목록을 로컬에서 불러왔습니다. (PAT 권한 제한)');
  }
}

async function onRepoChange() {
  const repo = document.getElementById('repo-select').value;
  if (!repo) return;
  currentSHAs = { schedule: null, events: null };
  ['schedule', 'events'].forEach(t => {
    setBadge(t, 'info', '대기');
    setMsg(t, '');
    setPreview(t, '');
    pendingFiles[t] = null;
    getZone(t).classList.remove('has-file', 'has-error');
  });
  updateCommitBtn();

  // 기존 파일 SHA 가져오기 (덮어쓰기 시 필요)
  for (const fname of ['schedule', 'events']) {
    try {
      const data = await ghGet(`/repos/${ORG}/${repo}/contents/${fname}.json`);
      currentSHAs[fname] = data.sha;
    } catch(e) {
      // 파일 없어도 OK
    }
  }
}

// ─── File handling ────────────────────────────────────────────────────────────
function handleDrag(e, type) {
  e.preventDefault();
  getZone(type).classList.add('drag-over');
}
function handleDragLeave(e, type) {
  getZone(type).classList.remove('drag-over');
}
function handleDrop(e, type) {
  e.preventDefault();
  getZone(type).classList.remove('drag-over');
  const file = e.dataTransfer.files[0];
  if (file) processFile(file, type);
}
function handleFileInput(e, type) {
  const file = e.target.files[0];
  if (file) processFile(file, type);
}

function processFile(file, type) {
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      const data = JSON.parse(ev.target.result);
      const errors = validateJSON(data, type);
      if (errors.length) {
        getZone(type).classList.remove('has-file');
        getZone(type).classList.add('has-error');
        setBadge(type, 'error', '오류');
        setMsg(type, 'error', '형식 오류:\n' + errors.join('\n'));
        setPreview(type, '');
        pendingFiles[type] = null;
      } else {
        getZone(type).classList.add('has-file');
        getZone(type).classList.remove('has-error');
        setBadge(type, 'ok', `✓ ${data.length}개 항목`);
        setMsg(type, 'success', `유효한 ${type}.json · 원본 파일명: "${file.name}" → ${type}.json 으로 저장됩니다`);
        renderPreview(type, data);
        pendingFiles[type] = JSON.stringify(data, null, 2);
      }
      updateCommitBtn();
    } catch(e) {
      getZone(type).classList.add('has-error');
      setBadge(type, 'error', '파싱 오류');
      setMsg(type, 'error', `JSON 파싱 실패: ${e.message}`);
      pendingFiles[type] = null;
      updateCommitBtn();
    }
  };
  reader.readAsText(file);
}

// ─── Validation ───────────────────────────────────────────────────────────────
const DATE_RE = /^\d{4}-\d{2}-\d{2}$/;
const TIME_RE = /^\d{2}:\d{2}$/;
const HEX_RE  = /^#[0-9a-fA-F]{3,6}$/;

function validateJSON(data, type) {
  const errs = [];
  if (!Array.isArray(data)) { errs.push('최상위가 배열이어야 합니다 ([ ... ])'); return errs; }
  if (data.length === 0) { errs.push('항목이 0개입니다.'); return errs; }

  if (type === 'schedule') {
    data.forEach((row, i) => {
      if (!row.date || !DATE_RE.test(row.date))
        errs.push(`[${i}] date 형식 오류 (YYYY-MM-DD 필요): "${row.date}"`);
      if (!row.time || !TIME_RE.test(row.time))
        errs.push(`[${i}] time 형식 오류 (HH:MM 필요): "${row.time}"`);
    });
  } else {
    data.forEach((row, i) => {
      if (!row.name)
        errs.push(`[${i}] name 누락`);
      if (!row.startDate || !DATE_RE.test(row.startDate))
        errs.push(`[${i}] startDate 형식 오류 (YYYY-MM-DD): "${row.startDate}"`);
      if (!row.endDate || !DATE_RE.test(row.endDate))
        errs.push(`[${i}] endDate 형식 오류 (YYYY-MM-DD): "${row.endDate}"`);
      if (!row.color || !HEX_RE.test(row.color))
        errs.push(`[${i}] color 형식 오류 (#hex): "${row.color}"`);
    });
  }
  return errs.slice(0, 8); // 최대 8개만
}

// ─── Preview ──────────────────────────────────────────────────────────────────
function renderPreview(type, data) {
  if (!data.length) return;
  const keys = Object.keys(data[0]);
  const rows = data.slice(0, 30).map(row =>
    `<tr>${keys.map(k => `<td>${esc(row[k] ?? '')}</td>`).join('')}</tr>`
  ).join('');
  const more = data.length > 30 ? `<tr><td colspan="${keys.length}" style="color:#606080;text-align:center">… 외 ${data.length-30}개</td></tr>` : '';
  setPreview(type, `<div class="preview-wrap"><table>
    <thead><tr>${keys.map(k => `<th>${esc(k)}</th>`).join('')}</tr></thead>
    <tbody>${rows}${more}</tbody>
  </table></div>`);
}

// ─── Commit ───────────────────────────────────────────────────────────────────
async function commitAll() {
  const repo = document.getElementById('repo-select').value;
  if (!repo) return;

  const btn = document.getElementById('commit-btn');
  btn.disabled = true;
  btn.textContent = '업로드 중…';
  showLog();

  const toUpload = Object.entries(pendingFiles).filter(([,v]) => v !== null);
  let allOk = true;

  for (const [type, content] of toUpload) {
    log(`inf`, `${type}.json 업로드 중…`);
    try {
      const b64 = btoa(unescape(encodeURIComponent(content)));
      const body = {
        message: `update ${type}.json via OTK Admin`,
        content: b64,
        ...(currentSHAs[type] ? { sha: currentSHAs[type] } : {})
      };
      const result = await ghPut(`/repos/${ORG}/${repo}/contents/${type}.json`, body);
      currentSHAs[type] = result.content.sha;
      log('ok', `${type}.json → ${repo} 커밋 완료 ✓`);
      setBadge(type, 'ok', '✓ 반영됨');
    } catch(e) {
      log('err', `${type}.json 실패: ${e.message}`);
      allOk = false;
    }
  }

  btn.textContent = allOk ? '🚀 GitHub에 반영하기' : '🚀 GitHub에 반영하기 (일부 실패)';
  btn.disabled = false;
  updateCommitBtn();
}

// ─── GitHub API helpers ────────────────────────────────────────────────────────
async function ghGet(path) {
  const res = await fetch(`https://api.github.com${path}`, {
    headers: { Authorization: `token ${pat}`, Accept: 'application/vnd.github+json' }
  });
  if (!res.ok) throw new Error(`${res.status} ${res.statusText}`);
  return res.json();
}

async function ghPut(path, body) {
  const res = await fetch(`https://api.github.com${path}`, {
    method: 'PUT',
    headers: {
      Authorization: `token ${pat}`,
      Accept: 'application/vnd.github+json',
      'Content-Type': 'application/json'
    },
    body: JSON.stringify(body)
  });
  if (!res.ok) {
    const txt = await res.text();
    throw new Error(`${res.status} – ${txt.slice(0, 120)}`);
  }
  return res.json();
}

// ─── UI helpers ───────────────────────────────────────────────────────────────
function getZone(type) { return document.getElementById(`${type}-zone`); }

function setBadge(type, cls, text) {
  const el = document.getElementById(`${type}-badge`);
  el.className = `badge badge-${cls}`;
  el.textContent = text;
}

function setMsg(type, kind, text) {
  const el = document.getElementById(`${type}-msg`);
  if (!text) { el.innerHTML = ''; return; }
  const cls = kind === 'error' ? 'msg-error' : kind === 'success' ? 'msg-success' : 'msg-info';
  el.innerHTML = `<div class="msg ${cls}">${esc(text).replace(/\n/g, '<br>')}</div>`;
}

function setPreview(type, html) {
  document.getElementById(`${type}-preview`).innerHTML = html;
}

function showMsg(id, kind, text) {
  const el = document.getElementById(id);
  const cls = kind === 'error' ? 'msg-error' : kind === 'success' ? 'msg-success' : 'msg-info';
  el.innerHTML = `<div class="msg ${cls}" style="margin-top:8px">${esc(text)}</div>`;
}

function updateCommitBtn() {
  const repo = document.getElementById('repo-select').value;
  const hasFile = pendingFiles.schedule !== null || pendingFiles.events !== null;
  document.getElementById('commit-btn').disabled = !(repo && hasFile);
}

function showLog() {
  const el = document.getElementById('log');
  el.style.display = 'block';
  el.innerHTML = '';
}

function log(cls, msg) {
  const el = document.getElementById('log');
  el.innerHTML += `<div class="log-line ${cls}">${esc(msg)}</div>`;
  el.scrollTop = el.scrollHeight;
}

function esc(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ─── Init ─────────────────────────────────────────────────────────────────────
(function init() {
  const stored = localStorage.getItem('otk_pat');
  if (stored) {
    pat = stored;
    document.getElementById('pat-input').value = stored;
    showMsg('pat-msg', 'info', '저장된 PAT를 불러왔습니다.');
    loadRepos();
  }
})();
</script>
</body>
</html>
